<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Victoria's Search Engine</title>
    <link rel="preload" href="/fonts/cursive.woff" as="font" type="font/woff" crossorigin="anonymous">
    <link rel="stylesheet" href="/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
</head>
<body>

<div class="container">
    <h1>What are you trying to find?</h1>

    <form action="/search" method="GET" class="search" role="search">
        <input type="text" placeholder="What are you looking for?..." name="q" required aria-label="Search query">
        <button type="submit" aria-label="search">
            <img src="/images/search.svg" alt="search icon">
        </button>
    </form>

    <div class="result-box" id="result-box">
    </div>
</div>

</body>
</html>
